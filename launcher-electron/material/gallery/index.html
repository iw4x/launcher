<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self';
                   font-src 'self'">
    <title>IW4x Launcher gallery</title>
    <link rel="stylesheet" href="./gallery.css">
    <script type="module" src="./gallery.ts"></script>
  </head>
  <body>
    <header class="title-bar">
      <span>Gallery</span>
      <button id="scheme" type="button">Light scheme</button>
    </header>
    <main>
      <m3-gallery-color></m3-gallery-color>
      <m3-gallery-type></m3-gallery-type>
      <m3-gallery-shape></m3-gallery-shape>

      <m3-gallery-icon></m3-gallery-icon>
      <m3-gallery-interaction></m3-gallery-interaction>
      <m3-gallery-avatar></m3-gallery-avatar>
      <m3-gallery-badge></m3-gallery-badge>
      <m3-gallery-button></m3-gallery-button>
      <m3-gallery-card></m3-gallery-card>
      <m3-gallery-dialog></m3-gallery-dialog>
      <m3-gallery-checkbox></m3-gallery-checkbox>
      <m3-gallery-divider></m3-gallery-divider>
      <m3-gallery-filter-chip></m3-gallery-filter-chip>
      <m3-gallery-icon-button></m3-gallery-icon-button>
      <m3-gallery-list></m3-gallery-list>
      <m3-gallery-navigation-rail></m3-gallery-navigation-rail>
      <m3-gallery-search-view></m3-gallery-search-view>
      <m3-gallery-side-sheet></m3-gallery-side-sheet>
      <m3-gallery-switch></m3-gallery-switch>
      <m3-gallery-tabs></m3-gallery-tabs>
      <m3-gallery-text-field></m3-gallery-text-field>
